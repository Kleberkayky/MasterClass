<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Class - Acesso e Cadastro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a171e url('imagem2.jpg') no-repeat center center fixed;
            background-size: cover;
            overflow-y: auto;
            position: relative;
            padding: 20px 0;
        }

        body::before {
            content: '';
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(90, 200, 250, 0.35) 0%, rgba(23, 185, 120, 0) 70%);
            top: -200px;
            left: -150px;
            border-radius: 40% 60% 70% 30% / 50% 50% 50% 50%;
            pointer-events: none;
            animation: organicFloat 10s ease-in-out infinite alternate;
        }

        @keyframes organicFloat {
            0% { transform: translate3d(0, 0, 0) rotate(0deg); }
            100% { transform: translate3d(30px, 40px, 0) rotate(10deg); }
        }

        .glass-card {
            background: rgba(207, 206, 206, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 28px;
            box-shadow: 
                0 25px 50px rgba(0, 10, 20, 0.35),
                inset 0 1px 1px rgba(255, 255, 255, 0.8);
            padding: 32px 40px;
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 10;
            animation: cardFade 0.5s ease-out forwards;
        }

        @keyframes cardFade {
            from { opacity: 0; transform: translate3d(0, 15px, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }

        /* Container da Foto da Escola */
        .school-photo-container {
            text-align: center;
            margin-bottom: 16px;
        }

        .school-photo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.2);
        }

        /* Título com Sombra para Alto Contraste */
        h2 {
            color: #ffffff;
            text-align: center;
            margin-bottom: 6px;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        }

        /* Subtítulo com Sombra */
        .subtitle {
            color: rgba(255, 255, 255, 0.95);
            text-align: center;
            font-size: 0.85rem;
            margin-bottom: 20px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        }

        .input-group {
            margin-bottom: 16px;
        }

        /* Rótulos (Labels) com Sombra */
        label {
            display: block;
            margin-bottom: 6px;
            color: rgba(255, 255, 255, 0.98);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.55);
            background: rgba(255, 255, 255, 0.35);
            font-size: 0.95rem;
            color: #ffffff;
            outline: none;
            transition: border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        select option {
            background: #0a171e;
            color: #ffffff;
            text-shadow: none;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }

        input:focus, select:focus {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 15px rgba(23, 185, 120, 0.4), inset 0 1px 2px rgba(255,255,255,0.5);
        }

        .field-error {
            color: #ffb3ba;
            font-size: 0.8rem;
            margin-top: 6px;
            font-weight: 500;
            display: none;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
        }

        input.error-input, select.error-input {
            border-color: #ff4d6d !important;
            background: rgba(255, 77, 109, 0.2) !important;
            box-shadow: 0 0 12px rgba(255, 77, 109, 0.4) !important;
        }

        button {
            width: 100%;
            margin-top: 10px;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            background: 
                linear-gradient(to bottom, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0.014) 50%),
                linear-gradient(135deg, #17b978 0%, #088395 100%);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(23, 185, 120, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.7);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
            transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
        }

        button:hover {
            transform: translate3d(0, -2px, 0);
            box-shadow: 0 12px 25px rgba(23, 185, 120, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.9);
            filter: brightness(1.1);
        }

        /* Área Inferior com Sombra Projetada */
        .toggle-mode {
            margin-top: 18px;
            text-align: center;
            color: rgba(255, 255, 255, 0.95);
            font-size: 0.85rem;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        }

        .toggle-mode a {
            color: #72f2c6;
            font-weight: 700;
            text-decoration: underline;
            cursor: pointer;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.7);
        }

        #globalMessage {
            margin-top: 16px;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            text-align: center;
            display: none;
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
        }

        .success {
            background: rgba(23, 185, 120, 0.35) !important;
            color: #d4ffec;
            border: 1px solid rgba(23, 185, 120, 0.6);
        }

        .error {
            background: rgba(255, 77, 109, 0.3) !important;
            color: #ffd1d6;
            border: 1px solid rgba(255, 77, 109, 0.6);
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <!-- Foto da Escola / Logo -->
        <div class="school-photo-container">
            <img src="imagem5.jpeg" alt="Foto da Escola Master Class" class="school-photo" id="schoolImg" onerror="this.src='https://via.placeholder.com/90?text=Escola'">
        </div>

        <h2 id="formTitle">Master Class</h2>
        <div class="subtitle" id="formSubtitle">Acesse sua conta educacional</div>

        <!-- Formulário de Login -->
        <form id="loginForm">
            <div class="input-group">
                <label for="loginEmail">E-mail</label>
                <input type="email" id="loginEmail" placeholder="seu.email@exemplo.com" required>
            </div>

            <div class="input-group">
                <label for="loginPassword">Senha</label>
                <input type="password" id="loginPassword" placeholder="Sua senha" required>
            </div>

            <button type="submit">Entrar na Plataforma</button>
        </form>

        <!-- Formulário de Cadastro -->
        <form id="registerForm" style="display: none;">
            <div class="input-group">
                <label for="name">Nome Completo <span style="font-size: 0.75rem; opacity: 0.8;">(Opcional)</span></label>
                <input type="text" id="name" placeholder="Ex: João da Silva">
                <div id="error-name" class="field-error"></div>
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu.email@exemplo.com">
                <div id="error-email" class="field-error"></div>
            </div>

            <div class="input-group">
                <label for="confirmEmail">Confirmar E-mail</label>
                <input type="email" id="confirmEmail" placeholder="Repita o e-mail">
                <div id="error-confirmEmail" class="field-error"></div>
            </div>

            <div class="input-group">
                <label for="role">Tipo de Usuário</label>
                <select id="role">
                    <option value="Aluno">Aluno</option>
                    <option value="Professor">Professor</option>
                    <option value="Administrador">Administrador</option>
                </select>
                <div id="error-role" class="field-error"></div>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Sua senha segura">
                <div id="error-password" class="field-error"></div>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirmar Senha</label>
                <input type="password" id="confirmPassword" placeholder="Repita a senha">
                <div id="error-confirmPassword" class="field-error"></div>
            </div>

            <button type="submit">Finalizar Cadastro</button>
        </form>

        <div id="globalMessage"></div>

        <!-- Área de texto inferior com sombra e texto "Você não tem uma conta?" -->
        <div class="toggle-mode">
            <span id="toggleText">Você não tem uma conta?</span> 
            <a id="toggleBtn">Cadastre-se</a>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const formTitle = document.getElementById('formTitle');
        const formSubtitle = document.getElementById('formSubtitle');
        const toggleBtn = document.getElementById('toggleBtn');
        const toggleText = document.getElementById('toggleText');
        const globalMessage = document.getElementById('globalMessage');

        let isLoginMode = true;

        // Alterna entre o modo Login e o modo Cadastro
        toggleBtn.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            globalMessage.style.display = 'none';

            if (isLoginMode) {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                formTitle.innerText = 'Master Class';
                formSubtitle.innerText = 'Acesse sua conta educacional';
                toggleText.innerText = 'Você não tem uma conta?';
                toggleBtn.innerText = 'Cadastre-se';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                formTitle.innerText = 'Criar Conta';
                formSubtitle.innerText = 'Junte-se à Master Class';
                toggleText.innerText = 'Já possui uma conta?';
                toggleBtn.innerText = 'Fazer Login';
            }
        });

        // Requisição de Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            globalMessage.style.display = 'none';

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('masterclass_user', JSON.stringify(data.user));
                    
                    globalMessage.style.display = 'block';
                    globalMessage.className = 'success';
                    globalMessage.innerText = `Bem-vindo(a), ${data.user.name}! Redirecionando...`;

                    setTimeout(() => {
                        window.location.href = 'home_page.html';
                    }, 1200);
                } else {
                    globalMessage.style.display = 'block';
                    globalMessage.className = 'error';
                    globalMessage.innerText = data.message || 'Erro ao realizar login.';
                }
            } catch (err) {
                console.error(err);
                globalMessage.style.display = 'block';
                globalMessage.className = 'error';
                globalMessage.innerText = 'Erro ao conectar ao servidor.';
            }
        });

        // Requisição de Cadastro
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            document.querySelectorAll('.field-error').forEach(el => {
                el.style.display = 'none';
                el.innerText = '';
            });
            document.querySelectorAll('input, select').forEach(el => {
                el.classList.remove('error-input');
            });
            globalMessage.style.display = 'none';

            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                confirmEmail: document.getElementById('confirmEmail').value,
                role: document.getElementById('role').value,
                password: document.getElementById('password').value,
                confirmPassword: document.getElementById('confirmPassword').value
            };

            try {
                const submitBtn = registerForm.querySelector('button[type="submit"]');
                const originalBtnText = submitBtn.innerText;
                submitBtn.innerText = 'Cadastrando...';
                submitBtn.disabled = true;

                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                submitBtn.innerText = originalBtnText;
                submitBtn.disabled = false;

                if (response.ok) {
                    globalMessage.style.display = 'block';
                    globalMessage.className = 'success';
                    globalMessage.innerText = data.message || 'Cadastro realizado com sucesso!';
                    registerForm.reset();

                    setTimeout(() => {
                        toggleBtn.click();
                    }, 1500);
                } else {
                    if (data.issues && Array.isArray(data.issues)) {
                        data.issues.forEach(issue => {
                            const fieldName = issue.path[0];
                            const errorDiv = document.getElementById(`error-${fieldName}`);
                            const inputField = document.getElementById(fieldName);

                            if (errorDiv) {
                                errorDiv.innerText = `* ${issue.message}`;
                                errorDiv.style.display = 'block';
                            }
                            if (inputField) {
                                inputField.classList.add('error-input');
                            }
                        });
                    }
                }
            } catch (err) {
                const submitBtn = registerForm.querySelector('button[type="submit"]');
                submitBtn.innerText = 'Finalizar Cadastro';
                submitBtn.disabled = false;

                console.error("Erro na requisição:", err);
                globalMessage.style.display = 'block';
                globalMessage.className = 'error';
                globalMessage.innerText = 'Erro ao conectar ao servidor.';
            }
        });
    </script>
</body>
</html>
