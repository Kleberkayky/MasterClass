<body>
    <svg aria-hidden="true" focusable="false" width="0" height="0" style="position:absolute;overflow:hidden;pointer-events:none">
        <filter id="liquidGlassRefraction" x="-15%" y="-15%" width="130%" height="130%">

        <main class="glass-panel panel-center">

                <h3 id="centerTitle">Quadro de Avisos</h3>
                <div class="header-actions">
                    <button class="top-icon-btn has-tooltip" data-tooltip="Pesquisar opções" id="searchToggleBtn"><svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
                    <button class="top-icon-btn has-tooltip" data-tooltip="Histórico de Atividades" id="activitiesHistoryBtn" style="display:none;"><svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><rect x="8" y="4" width="12" height="17" rx="2"/><path d="M16 4.5V3H10v1.5"/><path d="M12 10h4M12 14h4M12 18h4"/><path d="M4 7v14"/></svg></button>

            <div class="search-bar-container" id="searchBarContainer">

                    <input type="text" id="globalSearchInput" class="search-input" placeholder="Digite para pesquisar nas suas opções...">

                </div>

                    <span style="opacity:0.8;">Buscas recentes:</span>

            </div>
            
            <div class="content-sub-panel" id="contentSubPanel">

    <script>
        const storedUser = localStorage.getItem('masterclass_user');
        if (!storedUser) { window.location.href = 'index.html'; }

        let user = JSON.parse(storedUser);

        // Cache e controle de requisições em voo (evita fetch duplicado e acelera navegação)
        const apiCache = {
            courses: null,
            avisos: null,
            submissions: null,
            boletim: null
        };
        const pendingRequests = {};

        async function fetchWithDedupe(key, url, extractor) {
            if (apiCache[key] !== null) return apiCache[key];
            if (pendingRequests[key]) return pendingRequests[key];

            pendingRequests[key] = (async () => {
                try {
                    const res = await fetch(url);
                    const data = res.ok ? await res.json() : {};
                    const result = extractor(data);
                    apiCache[key] = result;
                    return result;
                } catch {
                    return [];
                } finally {
                    delete pendingRequests[key];
                }
            })();

            return pendingRequests[key];
        }

        function invalidateCache(...keys) {
            if (keys.length === 0) {
                Object.keys(apiCache).forEach(k => apiCache[k] = null);
            } else {
                keys.forEach(k => { if (k in apiCache) apiCache[k] = null; });
            }
        }

        const fetchCourses = () => fetchWithDedupe('courses', '/api/courses', d => d.courses || []);
        const fetchAvisos = () => fetchWithDedupe('avisos', '/api/avisos', d => d.avisos || []);
        const fetchSubmissions = () => fetchWithDedupe('submissions', '/api/submissions', d => d.submissions || []);
        const fetchStudentBoletim = () => fetchWithDedupe('boletim', `/api/boletim/${encodeURIComponent(user.email)}`, d => d.boletim || []);

        function updateSchoolLogoByTheme(isDark) {
            const logoElem = document.getElementById('schoolImg');
            if (logoElem) logoElem.src = isDark ? 'Imagem9.png' : 'imagem5.jpeg';
        }

        const isDarkTheme = localStorage.getItem('masterclass_theme') === 'dark';
        if (isDarkTheme) document.body.classList.add('dark-theme');
        updateSchoolLogoByTheme(isDarkTheme);

        if (localStorage.getItem('masterclass_legacy') === 'true') {
            document.body.classList.add('legacy-mode');
        }

        function focusAndScrollTo(el) {
            if (!el) return;
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            if (typeof el.focus === 'function') el.focus({ preventScroll: true });
        }

        function evaluateDeadlineClient(item) {
            if (!item || !item.endDate) {
                return { fora_do_prazo: 'F', isPastEnd: false, isClosed: false, inTolerance: false };
            }
            const now = Date.now();
            const end = new Date(item.endDate).getTime();
            const isProva = item.e_prova === 'V';
            const toleranceMs = isProva ? 0 : (2 * 24 * 60 * 60 * 1000);
            const limit = end + toleranceMs;

            const isPastEnd = now > end;
            const isClosed = now > limit;

            return {
                fora_do_prazo: isPastEnd ? 'V' : 'F',
                isPastEnd,
                isClosed,
                inTolerance: !isProva && isPastEnd && !isClosed
            };
        }

        const formatForaPrazoBadge = code => code === 'V' ? 'Fora do Prazo' : 'Dentro do Prazo';

        // Ícones SVG reutilizáveis

            gear: '<svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.2M12 19.3v2.2M4.93 4.93l1.56 1.56M17.51 17.51l1.56 1.56M2.5 12h2.2M19.3 12h2.2M4.93 19.07l1.56-1.56M17.51 6.49l1.56-1.56"/><circle cx="12" cy="12" r="7.2" stroke-dasharray="3.2 2.45"/></svg>',

            arrowRight: '<svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>',
            scale: '<svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="m16 16 3-8 3 8a5 5 0 0 1-6 0ZM2 16l3-8 3 8a5 5 0 0 1-6 0Z"/><path d="M12 3v18m-4 0h8m-8-17h8"/></svg>',
            gradCap: '<svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="m2 10 10-5 10 5-10 5z"/><path d="M6 12v5c4 3 8 3 12 0v-5m4-2v6"/></svg>',
            code: '<svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>',
            externalLink: '<svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>'
        };

        const mainMenu = document.getElementById('mainMenu');

        function renderMenu() {
            const avatarImg = `<img src="${user.avatar || 'imagem4.jpeg'}" alt="Perfil" class="profile-btn-avatar" id="navProfileAvatar">`;
            const menusByRole = {
                Administrador: [
                    { page: 'avisos', label: 'Quadro de Avisos', icon: ICONS.megaphone, active: true },
                    { page: 'admin_accounts', label: 'Controle de contas', icon: ICONS.shield },
                    { page: 'admin_courses', label: 'Gerenciar Cursos', icon: ICONS.folder },
                    { page: 'my_profile', label: 'Meu perfil', icon: avatarImg },
                    { page: 'settings', label: 'Configurações', icon: ICONS.gear }
                ],
                Aluno: [
                    { page: 'avisos', label: 'Quadro de Avisos', icon: ICONS.megaphone, active: true },
                    { page: 'my_courses', label: 'Meus Cursos', icon: ICONS.book },
                    { page: 'my_grades', label: 'Minhas Notas', icon: ICONS.exam },
                    { page: 'my_profile', label: 'Meu Perfil', icon: avatarImg },
                    { page: 'settings', label: 'Configurações', icon: ICONS.gear }
                ],
                Professor: [
                    { page: 'avisos', label: 'Quadro de Avisos', icon: ICONS.megaphone, active: true },
                    { page: 'my_courses', label: 'Meu Curso', icon: ICONS.book },
                    { page: 'my_grades', label: 'Lançar Notas', icon: ICONS.exam },
                    { page: 'my_profile', label: 'Meu Perfil', icon: avatarImg },
                    { page: 'settings', label: 'Configurações', icon: ICONS.gear }
                ]
            };

            const items = menusByRole[user.role] || menusByRole.Professor;
            mainMenu.innerHTML = items.map(item => `
                <li><a class="glass-btn has-tooltip${item.active ? ' active' : ''}" data-tooltip="${item.label}" data-page="${item.page}"><span class="btn-icon">${item.icon}</span><span class="btn-text">${item.label}</span></a></li>
            `).join('');
        }
        renderMenu();

        if (user.role === 'Aluno' || user.role === 'Professor') {
            const notifBtn = document.getElementById('notifToggleBtn');
            notifBtn.style.display = 'flex';
            setupNotifications(notifBtn);
        }

        if (user.role === 'Professor') {
            const histBtn = document.getElementById('activitiesHistoryBtn');
            histBtn.style.display = 'flex';
            histBtn.addEventListener('click', renderProfessorActivitiesHistory);
        }

        setupGlobalSearch();

        // Tooltip otimizado com requestAnimationFrame
        const tooltip = document.getElementById('globalTooltip');
        let tooltipRafPending = false;
        let lastMouseX = 0;
        let lastMouseY = 0;

        document.addEventListener('mouseover', (e) => {
            const target = e.target.closest('.has-tooltip');
            if (target) {
                const text = target.getAttribute('data-tooltip');
                if (text) {
                    tooltip.innerText = text;
                    tooltip.classList.add('visible');
                }
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (!tooltip.classList.contains('visible')) return;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
            if (!tooltipRafPending) {
                tooltipRafPending = true;
                requestAnimationFrame(() => {
                    tooltip.style.transform = `translate3d(${lastMouseX + 14}px, ${lastMouseY + 14}px, 0)`;
                    tooltip.style.left = '0px';
                    tooltip.style.top = '0px';
                    tooltipRafPending = false;
                });
            }
        }, { passive: true });

        document.addEventListener('mouseout', (e) => {
            if (e.target.closest('.has-tooltip')) tooltip.classList.remove('visible');
        });

        const sidebar = document.getElementById('sidebar');
        const brandAboutTrigger = document.getElementById('brandAboutTrigger');

        document.getElementById('sidebarBrandToggle').addEventListener('click', (e) => {
            if (e.target.closest('#brandAboutTrigger')) return;
            sidebar.classList.toggle('collapsed');
        });

        function openAboutProjectModal() {
            const existing = document.getElementById('aboutProjectModalOverlay');
            if (existing) existing.remove();

            const currentLogoSrc = document.body.classList.contains('dark-theme') ? 'Imagem9.png' : 'imagem5.jpeg';
            const modalDiv = document.createElement('div');
            modalDiv.className = 'modal-overlay';
            modalDiv.id = 'aboutProjectModalOverlay';
            modalDiv.innerHTML = `
                <div class="modal-card about-modal-card" role="dialog" aria-modal="true" aria-labelledby="aboutModalTitle">
                    <div class="about-header">
                        <img src="${currentLogoSrc}" alt="Logo Master Class" class="about-logo" onerror="this.src='https://via.placeholder.com/54?text=MC'">
                        <div>
                            <div class="about-brand-heading" id="aboutModalTitle">Master Class</div>
                            <div class="about-subtitle">Sobre o Projeto &amp; Desenvolvimento</div>
                        </div>
                    </div>

                    <div class="about-sections">
                        <div class="about-block">
                            <div class="about-block-title">${ICONS.book} Sobre a Plataforma</div>
                            <p>
                                O <strong>Master Class</strong> é um protótipo de design e desenvolvimento de uma plataforma de estudos. Uma das principais inspirações para sua criação foi o <strong>AVA</strong> da minha faculdade: a partir da análise prática de seus pontos fortes e fracos no dia a dia acadêmico, busquei reunir nesta interface as melhorias de usabilidade, organização e fluidez visual que eu gostaria de ver em um ambiente virtual de aprendizagem moderno.
                            </p>
                        </div>

                        <div class="about-block">
                            <div class="about-block-title">${ICONS.sparkle} Em Desenvolvimento &amp; Próximos Passos</div>
                            <p>O projeto segue em evolução contínua, com novas funcionalidades planejadas para expandir a experiência de ensino e gestão:</p>
                            <ul class="about-roadmap-list">
                                <li><span class="about-roadmap-dot"></span><span><strong>Biblioteca Digital:</strong> acervo integrado de materiais complementares e referências de estudo para os cursos.</span></li>
                                <li><span class="about-roadmap-dot"></span><span><strong>Integração com Inteligência Artificial:</strong> ferramentas de apoio dedicadas a <strong>administradores</strong> e <strong>professores</strong> para otimizar rotinas pedagógicas e administrativas.</span></li>
                            </ul>
                        </div>

                        <div class="about-block">
                            <div class="about-block-title">${ICONS.gradCap} Autor</div>
                            <p>
                                Desenvolvido por <strong>Kleber Kayky Coelho Cruz</strong>, acadêmico de <strong>Engenharia da Computação</strong> na <strong>META Centro Universitário</strong>.
                            </p>
                        </div>
                    </div>

                    <div class="about-actions">
                        <a href="https://github.com/Kleberkayky/MasterClass" target="_blank" rel="noopener noreferrer" class="glass-btn" style="flex: 1; min-width: 210px; padding: 11px 16px; justify-content: center;">
                            ${ICONS.code}<span>Ver Repositório no GitHub</span>${ICONS.externalLink}
                        </a>
                        <button type="button" id="btnCloseAboutModal" class="glass-btn btn-logout" style="flex: 0 0 auto; width: auto; min-width: 120px; padding: 11px 18px; justify-content: center; margin-top: 0;">
                            Fechar
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(modalDiv);

            const closeModal = () => modalDiv.remove();
            modalDiv.querySelector('#btnCloseAboutModal').addEventListener('click', closeModal);
            modalDiv.addEventListener('click', (ev) => {
                if (ev.target === modalDiv) closeModal();
            });
            const escHandler = (ev) => {
                if (ev.key === 'Escape') {
                    closeModal();
                    document.removeEventListener('keydown', escHandler);
                }
            };
            document.addEventListener('keydown', escHandler);
        }

        brandAboutTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            tooltip.classList.remove('visible');
            openAboutProjectModal();
        });

        brandAboutTrigger.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                e.stopPropagation();
                tooltip.classList.remove('visible');
                openAboutProjectModal();
            }
        });

        const centerTitle = document.getElementById('centerTitle');
        const centerContent = document.getElementById('centerContent');
        let toastTimer = null;

        function showToast(txt, targetFocusElem = null) {
            const toast = document.getElementById('toastMsg');
            toast.innerText = txt;
            toast.style.display = 'block';
            focusAndScrollTo(targetFocusElem || toast);
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toast.style.display = 'none'; }, 3500);
        }

        function enableImageResizingInEditor(editorElement) {
            let activeToolbar = null;
            let selectedImage = null;

            function positionToolbar() {
                if (!activeToolbar || !selectedImage) return;
                const rect = selectedImage.getBoundingClientRect();
                activeToolbar.style.top = `${window.scrollY + rect.top - 42}px`;
                activeToolbar.style.left = `${window.scrollX + rect.left + (rect.width / 2) - 130}px`;
            }

            function removeToolbar() {
                if (activeToolbar) {
                    activeToolbar.remove();
                    activeToolbar = null;
                }
                if (selectedImage) {
                    selectedImage.classList.remove('image-selected-outline');
                    selectedImage = null;
                }
                window.removeEventListener('scroll', positionToolbar);
                window.removeEventListener('resize', positionToolbar);
            }

            editorElement.addEventListener('click', (e) => {
                const img = e.target.closest('img');
                if (img && editorElement.contains(img)) {
                    e.stopPropagation();
                    if (selectedImage !== img) {
                        removeToolbar();
                        selectedImage = img;
                        selectedImage.classList.add('image-selected-outline');
                        showToolbarForImage(selectedImage);
                    }
                    return;
                }
                if (!e.target.closest('.image-resize-toolbar')) removeToolbar();
            });

            function showToolbarForImage(img) {
                activeToolbar = document.createElement('div');
                activeToolbar.className = 'image-resize-toolbar';
                activeToolbar.innerHTML = `
                    <span style="font-size:0.75rem; color:#fef3c7; font-weight:700; margin-right:4px;">Tamanho:</span>
                    <button type="button" data-size="25">Pequena (25%)</button>
                    <button type="button" data-size="50">Média (50%)</button>
                    <button type="button" data-size="75">Grande (75%)</button>
                    <button type="button" data-size="100">Máximo (100%)</button>
                    <button type="button" data-size="custom">Outro...</button>
                    <button type="button" data-action="delete" style="background: rgba(220,38,38,0.4); border-color: rgba(220,38,38,0.6);">${ICONS.trash}</button>
                `;

                document.body.appendChild(activeToolbar);
                positionToolbar();
                window.addEventListener('scroll', positionToolbar, { passive: true });
                window.addEventListener('resize', positionToolbar, { passive: true });

                activeToolbar.querySelectorAll('button').forEach(btn => {
                    btn.addEventListener('click', (ev) => {
                        ev.stopPropagation();
                        const size = btn.getAttribute('data-size');
                        const action = btn.getAttribute('data-action');

                        if (action === 'delete') {
                            img.remove();
                            removeToolbar();
                            return;
                        }

                        if (size === 'custom') {
                            const currentPct = Math.round(parseFloat(img.style.width) || 100);
                            const val = prompt('Digite a largura desejada em % (máx 100%):', currentPct);
                            if (val !== null) {
                                let num = parseInt(val, 10);
                                if (isNaN(num) || num < 10) num = 10;
                                if (num > 100) num = 100;
                                img.style.width = num + '%';
                                img.style.maxWidth = '100%';
                                img.style.height = 'auto';
                            }
                        } else if (size) {
                            img.style.width = size + '%';
                            img.style.maxWidth = '100%';
                            img.style.height = 'auto';
                        }
                        positionToolbar();
                    });
                });
            }
        }

        function insertImageIntoEditor(inputEl, editorEl) {
            inputEl.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    editorEl.focus();
                    const imgHtml = `<img src="${event.target.result}" alt="Imagem" style="width: 75%; max-width: 100%; height: auto;">`;
                    if (!document.execCommand('insertHTML', false, imgHtml)) {
                        editorEl.innerHTML += imgHtml;
                    }
                };
                reader.readAsDataURL(file);
                e.target.value = '';
            });
        }

        function setupGlobalSearch() {
            const searchToggleBtn = document.getElementById('searchToggleBtn');
            const searchBarContainer = document.getElementById('searchBarContainer');
            const btnCloseSearch = document.getElementById('btnCloseSearch');
            const globalSearchInput = document.getElementById('globalSearchInput');
            const searchResultsDropdown = document.getElementById('searchResultsDropdown');

            searchToggleBtn.addEventListener('click', () => {
                const isVisible = searchBarContainer.style.display === 'flex';
                searchBarContainer.style.display = isVisible ? 'none' : 'flex';
                if (!isVisible) {
                    globalSearchInput.focus();
                    renderRecentSearches();
                }
            });
            btnCloseSearch.addEventListener('click', () => { searchBarContainer.style.display = 'none'; });

            const allPages = [
                { name: 'Quadro de Avisos', pageKey: 'avisos', roles: ['Administrador', 'Aluno', 'Professor'] },
                { name: 'Controle de Contas', pageKey: 'admin_accounts', roles: ['Administrador'] },
                { name: 'Gerenciar Cursos', pageKey: 'admin_courses', roles: ['Administrador'] },
                { name: 'Meus Cursos / Meu Curso', pageKey: 'my_courses', roles: ['Aluno', 'Professor'] },
                { name: 'Minhas Notas / Lançar Notas', pageKey: 'my_grades', roles: ['Aluno', 'Professor'] },
                { name: 'Meu Perfil', pageKey: 'my_profile', roles: ['Administrador', 'Aluno', 'Professor'] },
                { name: 'Configurações', pageKey: 'settings', roles: ['Administrador', 'Aluno', 'Professor'] }
            ];

            const availablePages = allPages.filter(p => p.roles.includes(user.role));

            globalSearchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                if (!query) {
                    searchResultsDropdown.style.display = 'none';
                    return;
                }

                const matches = availablePages.filter(p => p.name.toLowerCase().includes(query));
                searchResultsDropdown.style.display = 'block';

                if (matches.length === 0) {
                    searchResultsDropdown.innerHTML = `<div style="padding: 6px 10px; font-size: 0.85rem; opacity: 0.8; text-align: center;">Nenhum resultado encontrado.</div>`;
                    return;
                }

                searchResultsDropdown.innerHTML = matches.map(m => `
                    <div class="search-result-item" data-page="${m.pageKey}" style="padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.88rem; background: rgba(255,255,255,0.1); margin-bottom: 4px;">
                        <svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg> ${m.name}
                    </div>
                `).join('');

                searchResultsDropdown.querySelectorAll('.search-result-item').forEach(item => {
                    item.addEventListener('click', () => {
                        triggerPageNavigation(item.getAttribute('data-page'));
                        searchBarContainer.style.display = 'none';
                        globalSearchInput.value = '';
                        searchResultsDropdown.style.display = 'none';
                    });
                });
            });
        }

        function getRecentSearches() {
            try { return JSON.parse(localStorage.getItem('masterclass_recent_searches') || '[]'); } catch { return []; }
        }
        function renderRecentSearches() {
            const area = document.getElementById('recentSuggestionsArea');
            const recent = getRecentSearches();
            area.innerHTML = '<span style="opacity:0.8; font-size:0.78rem;">Recentes:</span>' + recent.map(r => `<span class="suggestion-chip">${r}</span>`).join('');
        }

        function triggerPageNavigation(pageKey) {
            const btn = mainMenu.querySelector(`.glass-btn[data-page="${pageKey}"]`);
            if (btn) {
                mainMenu.querySelectorAll('.glass-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderPage(pageKey);
            }
        }

        const getReadNotificationsKey = () => `masterclass_read_notifs_${user.email.toLowerCase()}`;

        function getReadNotifications() {
            try { return JSON.parse(localStorage.getItem(getReadNotificationsKey()) || '[]'); } catch { return []; }
        }

        function markNotificationAsRead(notifId) {
            const readList = getReadNotifications();
            if (!readList.includes(notifId)) {
                readList.push(notifId);
                localStorage.setItem(getReadNotificationsKey(), JSON.stringify(readList));
            }
        }

        async function setupNotifications(notifBtn) {
            const badge = document.getElementById('notifBadge');
            try {
                const res = await fetch('/api/notifications', { headers: { 'x-user-role': user.role } });
                const data = await res.json();
                if (res.ok) {
                    const allNotifs = data.notifications || [];
                    const readList = getReadNotifications();
                    const unreadCount = allNotifs.filter(n => !readList.includes(n.id)).length;

                    if (unreadCount > 0) {
                        badge.innerText = unreadCount;
                        badge.style.display = 'inline-block';
                    } else {
                        badge.style.display = 'none';
                    }

                    notifBtn.addEventListener('click', () => renderNotificationsModal(allNotifs));
                }
            } catch {}
        }

        function renderNotificationsModal(notifications) {
            const readList = getReadNotifications();
            const unreadNotifications = notifications.filter(n => !readList.includes(n.id));

            const modalDiv = document.createElement('div');
            modalDiv.className = 'modal-overlay';
            modalDiv.innerHTML = `
                <div class="modal-card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <h3 style="margin: 0;"><svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg> Central de Notificações</h3>
                        <button type="button" id="btnMarkAllRead" style="background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: #fff; font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; cursor: pointer;">Marcar todas como lidas</button>
                    </div>
                    <div style="overflow-y: auto; max-height: 350px; display:flex; flex-direction:column; gap:8px;" id="notifListContainer">
                        ${unreadNotifications.length === 0 ? '<p style="text-align: center; opacity: 0.8; font-size: 0.9rem; padding: 20px 0;">Nenhuma notificação nova no momento.</p>' : ''}
                        ${unreadNotifications.map(n => `
                            <div class="notif-item unread" data-id="${n.id}" style="background: rgba(255,255,255,0.2); padding: 10px; border-radius: 8px; border-left: 4px solid #f59e0b; cursor: pointer; transition: background 0.2s;">
                                <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                                    <strong style="font-size:0.9rem; color:#fef3c7;">${n.title}</strong>
                                    <span style="font-size:0.65rem; background:#ef4444; color:#fff; padding:2px 6px; border-radius:4px;">Nova</span>
                                </div>
                                <div style="font-size:0.8rem; opacity:0.9; margin-top:4px;">${n.description}</div>
                            </div>
                        `).join('')}
                    </div>
                    <button type="button" id="btnCloseNotifModal" class="glass-btn btn-logout" style="margin-top: 14px; padding: 10px; justify-content: center;">Fechar</button>
                </div>
            `;
            document.body.appendChild(modalDiv);

            modalDiv.querySelectorAll('.notif-item').forEach(item => {
                item.addEventListener('click', () => {
                    markNotificationAsRead(item.getAttribute('data-id'));
                    item.remove();

                    const container = modalDiv.querySelector('#notifListContainer');
                    if (container.querySelectorAll('.notif-item').length === 0) {
                        container.innerHTML = '<p style="text-align: center; opacity: 0.8; font-size: 0.9rem; padding: 20px 0;">Nenhuma notificação nova no momento.</p>';
                    }
                    updateBadgeCount(notifications);
                });
            });

            modalDiv.querySelector('#btnMarkAllRead').addEventListener('click', () => {
                notifications.forEach(n => markNotificationAsRead(n.id));
                modalDiv.querySelector('#notifListContainer').innerHTML = '<p style="text-align: center; opacity: 0.8; font-size: 0.9rem; padding: 20px 0;">Nenhuma notificação nova no momento.</p>';
                updateBadgeCount(notifications);
            });

            modalDiv.querySelector('#btnCloseNotifModal').addEventListener('click', () => modalDiv.remove());
        }

        function updateBadgeCount(notifications) {
            const badge = document.getElementById('notifBadge');
            if (!badge) return;
            const readList = getReadNotifications();
            const unreadCount = notifications.filter(n => !readList.includes(n.id)).length;

            if (unreadCount > 0) {
                badge.innerText = unreadCount;
                badge.style.display = 'inline-block';
            } else {
                badge.innerText = '0';
                badge.style.display = 'none';
            }
        }

                                <table class="admin-table" id="accountsTable">
                                    <thead>
                                        <tr>
                                            <th>Nome</th>
                                            <th>E-mail</th>
                                            <th>Perfil</th>
                                            <th>Ações</th>

                                    </thead>

                        function renderTableRows() {

                        }
                        renderProfessorCourseView(assigned);
                    } else {
                        // Busca paralela de cursos e submissões
                        const [courses, subs] = await Promise.all([fetchCourses(), fetchSubmissions()]);
                        const userEmailLower = user.email.toLowerCase();

                        // Indexação O(1) das submissões do aluno por contentId
                        const mySubsMap = new Map();
                        subs.forEach(s => {
                            if (s.studentEmail.toLowerCase() === userEmailLower) {
                                mySubsMap.set(s.contentId, s);
                            }
                        });

                        const pendingAssignments = [];
                        courses.forEach(c => {
                            c.modules.forEach(m => {
                                m.contents.forEach(cnt => {
                                    if (!cnt.isAssignment) return;
                                    const mySub = mySubsMap.get(cnt.id);
                                    const isAppealAccepted = mySub && mySub.appealStatus === 'accepted';
                                    const deadlineInfo = evaluateDeadlineClient(cnt);
                                    if (deadlineInfo.isClosed && !isAppealAccepted) return;
                                    if (mySub && mySub.grade !== null && mySub.grade !== undefined && String(mySub.grade).trim() !== '' && !isAppealAccepted) return;

                                    pendingAssignments.push({ ...cnt, courseTitle: c.title, courseId: c.id, moduleId: m.id, deadlineInfo, mySub });
                                });
                            });
                        });
                        pendingAssignments.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

        function renderStudentCourseSelector(boletimList, mode) {
            const titlesMap = {
                boletim: "Meu Boletim — Selecione o Curso",
                atividades: "Atividades Corrigidas — Selecione o Curso",
                provas: "Provas Corrigidas — Selecione o Curso"
            };
            const descriptionsMap = {
                boletim: "Escolha individualmente o curso para visualizar o seu boletim detalhado:",
                atividades: "Escolha o curso que deseja consultar as atividades já corrigidas e com nota:",
                provas: "Escolha o curso que deseja consultar as provas já corrigidas e com nota:"
            };

            centerTitle.innerText = titlesMap[mode];
            centerContent.innerHTML = `
                <button class="back-btn" id="btnBackToGradesHub">Voltar para Minhas Notas</button>
                <p>${descriptionsMap[mode]}</p>
                <div class="courses-grid">
                    ${boletimList.length === 0 ? '<p style="opacity:0.85;">Nenhum curso disponível para consulta.</p>' : ''}
                    ${boletimList.map(c => {
                        let badgeInfo = '';
                        if (mode === 'atividades') {
                            const countAt = c.modules.reduce((acc, m) => acc + (m.correctedItems || []).filter(i => i.e_prova !== 'V').length, 0);
                            badgeInfo = `<span style="font-size:0.75rem; background: rgba(16, 185, 129, 0.45); padding: 3px 8px; border-radius: 6px; width: fit-content; margin-top: 4px; font-weight: 600;">${countAt} atividade(s)</span>`;
                        } else if (mode === 'provas') {
                            const countAv = c.modules.reduce((acc, m) => acc + (m.correctedItems || []).filter(i => i.e_prova === 'V').length, 0);
                            badgeInfo = `<span style="font-size:0.75rem; background: rgba(59, 130, 246, 0.45); padding: 3px 8px; border-radius: 6px; width: fit-content; margin-top: 4px; font-weight: 600;">${countAv} prova(s)</span>`;
                        } else {
                            badgeInfo = `<span style="font-size:0.75rem; background: rgba(245, 158, 11, 0.45); padding: 3px 8px; border-radius: 6px; width: fit-content; margin-top: 4px; font-weight: 600;">Ver Boletim Completo</span>`;
                        }

                        return `
                            <div class="course-card select-grade-course-card" data-course-id="${c.courseId}" style="border: 2px solid rgba(255, 255, 255, 0.55); background: rgba(255, 255, 255, 0.24);">
                                <div class="course-title">${ICONS.book} ${c.courseTitle}</div>
                                <div class="course-desc">${c.courseDescription || 'Clique para acessar os registros deste curso.'}</div>

                                ${badgeInfo}
                            </div>
                        `;
                    }).join('')}
                </div>
            `;

            document.getElementById('btnBackToGradesHub').addEventListener('click', renderStudentGradesHub);

            document.querySelectorAll('.select-grade-course-card').forEach(card => {
                card.addEventListener('click', () => {
                    const courseId = card.getAttribute('data-course-id');
                    const courseReport = boletimList.find(x => x.courseId === courseId);

                    if (mode === 'boletim') {
                        renderStudentCourseBoletimDetail(courseReport, boletimList);
                    } else {
                        renderStudentCorrectedEvaluationsDetail(courseReport, boletimList, mode === 'provas');
                    }
                });
            });
        }

            const items = [];
            courseReport.modules.forEach(m => {

                        ? `<p style="opacity:0.85; font-size:0.9rem; padding: 10px 0;">Nenhuma ${isProvaOnly ? 'prova' : 'atividade'} encontrada para este curso até o momento.</p>`

                                        <th>Assunto</th>

                                        <th>Nota</th>
                                        <th>Apelação / Ações</th>

                                        const atrasoBadgeBg = isAtrasada ? 'rgba(220, 38, 38, 0.7)' : 'rgba(16, 185, 129, 0.6)';

                                        let deliveryDateStr = '-';
                                        if (item.submittedAt) {
                                            deliveryDateStr = new Date(item.submittedAt).toLocaleString('pt-BR');
                                        } else if (item.endDate) {
                                            deliveryDateStr = `Prazo: ${new Date(item.endDate).toLocaleString('pt-BR')}`;
                                        }

                                        const codeTag = item.evaluationCode ? `<span style="font-size:0.72rem; background:rgba(255,255,255,0.18); padding:2px 6px; border-radius:4px; margin-right:6px;">${item.evaluationCode}</span>` : '';

                                        let appealHtml = '-';
                                        const appealStatus = item.appealStatus || 'none';

                                        if (isZeroedWithoutSubmission) {
                                            if (appealStatus === 'none' || !appealStatus) {
                                                appealHtml = `<button class="glass-btn btn-request-appeal" data-sub-id="${item.subId}" style="width: auto; padding: 6px 10px; font-size: 0.75rem; background: linear-gradient(135deg, #f59e0b, #d97706);">Pedir Apelação</button>`;
                                            } else if (appealStatus === 'requested') {
                                                appealHtml = `<span style="font-size: 0.75rem; background: rgba(245, 158, 11, 0.4); padding: 4px 8px; border-radius: 6px; font-weight: 600;">⏳ Apelação solicitada (Aguardando)</span>`;
                                            } else if (appealStatus === 'accepted') {
                                                const deadlineAppealStr = item.appealDeadline ? new Date(item.appealDeadline).toLocaleString('pt-BR') : '24h';
                                                appealHtml = `
                                                    <div style="display:flex; flex-direction:column; gap:4px;">
                                                        <span style="font-size: 0.72rem; color: #34d399; font-weight: 700;">${ICONS.sparkle} Apelação Aceita! Envie até ${deadlineAppealStr}</span>
                                                        <button class="glass-btn btn-open-assignment-appeal" data-id="${item.contentId}" data-course="${courseReport.courseId}" data-module="${item.moduleId}" style="width: auto; padding: 5px 10px; font-size: 0.75rem; background: linear-gradient(135deg, #10b981, #059669);">Enviar Atividade</button>
                                                    </div>
                                                `;
                                            } else if (appealStatus === 'rejected') {

        async function renderProfessorActivitiesList(course, moduleObj, isEvaluated) {
            centerTitle.innerText = `${moduleObj.name} > ${isEvaluated ? 'Atividades Avaliadas' : 'Atividades Não Avaliadas'}`;
            const subs = await fetchSubmissions();

            // Agrupamento O(n) de submissões por contentId
            const subsByContent = new Map();
            subs.forEach(s => {
                if (!subsByContent.has(s.contentId)) subsByContent.set(s.contentId, []);
                subsByContent.get(s.contentId).push(s);
            });

            const filteredContents = moduleObj.contents.filter(cnt => {
                if (!cnt.isAssignment) return false;
                const actSubs = subsByContent.get(cnt.id) || [];
                const hasAnyEvaluatedSub = actSubs.some(s => s.grade !== null && s.grade !== undefined && String(s.grade).trim() !== '');
                return isEvaluated ? hasAnyEvaluatedSub : !hasAnyEvaluatedSub;
            });

            centerContent.innerHTML = `
                <button class="back-btn" id="backToGradeOptions">Voltar às Opções</button>
                <div style="display:flex; flex-direction:column; gap:14px; margin-top:8px;">
                    ${filteredContents.length === 0 ? `<p style="opacity:0.8;">Nenhuma ${isEvaluated ? 'atividade avaliada' : 'atividade não avaliada'} encontrada neste módulo.</p>` : ''}
                    ${filteredContents.map(act => {
                        const actSubs = subsByContent.get(act.id) || [];
                        const deadlineInfo = evaluateDeadlineClient(act);
                        const actForaPrazo = act.fora_do_prazo || deadlineInfo.fora_do_prazo;
                        const badgeColor = actForaPrazo === 'V' ? 'rgba(220, 38, 38, 0.7)' : 'rgba(16, 185, 129, 0.6)';
                        const badgeText = formatForaPrazoBadge(actForaPrazo);
                        const isProva = act.e_prova === 'V';

                        const infoPrazoExtra = isProva
                            ? (deadlineInfo.isPastEnd ? ' | Sem tolerância' : '')
                            : ' | Tolerância: 2 dias';

                        return `
                            <div style="background: rgba(255,255,255,0.15); padding: 14px; border-radius: 12px; display:flex; flex-direction:column; gap:10px;">
                                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
                                    <div>
                                        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                                            <strong style="color: #fef3c7; font-size:1rem;">${isProva ? `${ICONS.exam} [PROVA${act.evaluationCode ? ' - ' + act.evaluationCode : ''}]` : `${ICONS.clipboard} [ATIVIDADE${act.evaluationCode ? ' - ' + act.evaluationCode : ''}]`} ${act.subject}</strong>
                                            <span style="font-size:0.72rem; font-weight:700; padding:2px 8px; border-radius:6px; background:${badgeColor};">${badgeText}</span>
                                            <span style="font-size:0.72rem; font-weight:600; padding:2px 8px; border-radius:6px; background:rgba(245,158,11,0.35);">Nota: 0.0 a 5.0</span>
                                        </div>
                                        <div style="font-size:0.85rem; opacity:0.9; margin-top:2px;">${act.description || 'Sem descrição'}</div>
                                        <div style="font-size:0.75rem; opacity:0.8; margin-top:2px;">Entrega final: ${act.endDate ? new Date(act.endDate).toLocaleString('pt-BR') : '-'}${infoPrazoExtra}</div>
                                    </div>
                                </div>
                                <div style="background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px;">
                                    <strong style="font-size:0.85rem; color:#fef3c7;">Respostas dos Alunos:</strong>
                                    ${actSubs.length === 0 ? '<div style="font-size:0.8rem; opacity:0.7; margin-top:4px;">Nenhum aluno enviou resposta ainda.</div>' : ''}
                                    <div style="display:flex; flex-direction:column; gap:6px; margin-top:6px;">
                                        ${actSubs.map(sub => {
                                            const subPrazo = sub.fora_do_prazo || actForaPrazo;
                                            const subBadgeBg = subPrazo === 'V' ? 'rgba(220, 38, 38, 0.65)' : 'rgba(16, 185, 129, 0.55)';
                                            const subBadgeText = formatForaPrazoBadge(subPrazo);
                                            return `
                                                <div style="background: rgba(255,255,255,0.1); padding: 8px; border-radius: 6px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
                                                    <div style="flex: 1; min-width: 180px;">
                                                        <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                                                            <span style="font-weight:600; font-size:0.85rem;">${sub.studentName} (${sub.studentEmail})</span>
                                                            <span style="font-size:0.68rem; font-weight:700; padding:1px 6px; border-radius:4px; background:${subBadgeBg};">${subBadgeText}</span>
                                                            <span style="font-size:0.72rem; opacity:0.8;">(${sub.status})</span>
                                                        </div>
                                                        <div class="rendered-content" style="font-size:0.8rem; opacity:0.9; margin-top:2px; word-break:break-word;">Resposta: ${sub.submissionHtml || '<i>Sem resposta enviada</i>'}</div>
                                                    </div>
                                                    <div style="display:flex; gap:6px; align-items:center;">
                                                        <input type="number" min="0" max="5" step="0.1" class="admin-input grade-input" data-sub-id="${sub.id}" value="${sub.grade !== null && sub.grade !== undefined ? sub.grade : ''}" placeholder="0.0 - 5.0" style="width: 85px; padding: 6px; font-size:0.85rem;">
                                                        <button class="glass-btn btn-save-grade" data-sub-id="${sub.id}" style="width: auto; padding: 6px 10px; font-size: 0.78rem;">Salvar</button>
                                                    </div>
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;

            document.getElementById('backToGradeOptions').addEventListener('click', () => renderProfessorGradeOptions(course, moduleObj));

            centerContent.querySelectorAll('.btn-save-grade').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const subId = btn.getAttribute('data-sub-id');
                    const gradeInput = btn.closest('div').querySelector('.grade-input');
                    const gradeRaw = gradeInput.value.trim();

                    if (gradeRaw !== '') {
                        const numericGrade = parseFloat(gradeRaw.replace(',', '.'));
                        if (isNaN(numericGrade) || numericGrade < 0.0) {
                            showToast('Erro: A nota deve ser um valor numérico entre 0.0 e 5.0.', gradeInput);
                            return;
                        }
                        if (numericGrade > 5.0) {
                            showToast('Erro: As atividades e provas avaliativas têm nota máxima até 5.0.', gradeInput);
                            return;
                        }
                    }

                    const res = await fetch(`/api/submissions/${subId}/grade`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'x-user-role': user.role },
                        body: JSON.stringify({ grade: gradeRaw, gradedBy: user.name, gradedByEmail: user.email })
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        showToast(data.message || 'Erro ao lançar nota.', gradeInput);
                        return;
                    }
                    invalidateCache('submissions', 'boletim');
                    showToast(data.message || 'Nota salva!');
                    renderProfessorActivitiesList(course, moduleObj, isEvaluated);
                });
            });
        }

                    </div>
                </div>
            `;
            document.body.appendChild(modalDiv);

            const ed = modalDiv.querySelector('#richAvisoEditor');
            enableImageResizingInEditor(ed);
            insertImageIntoEditor(modalDiv.querySelector('#inputAvisoImg'), ed);

            modalDiv.querySelector('#btnAvisoBold').addEventListener('click', () => { ed.focus(); document.execCommand('bold'); });
            modalDiv.querySelector('#btnAvisoItalic').addEventListener('click', () => { ed.focus(); document.execCommand('italic'); });
            modalDiv.querySelector('#btnCloseAvisoModal').addEventListener('click', () => modalDiv.remove());

            let attachedFileObj = null;
            modalDiv.querySelector('#inputAvisoFile').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    attachedFileObj = { name: file.name, type: file.type, data: event.target.result };
                };
                reader.readAsDataURL(file);
            });

            modalDiv.querySelector('#btnPublishAviso').addEventListener('click', async () => {
                const subject = modalDiv.querySelector('#inputAvisoSubject').value.trim();
                const description = modalDiv.querySelector('#inputAvisoDesc').value.trim();

                if (!subject) {
                    showToast('O assunto do aviso é obrigatório!');
                    return;
                }

                const res = await fetch('/api/admin/avisos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-user-role': user.role },
                    body: JSON.stringify({
                        subject,
                        description,
                        textHtml: ed.innerHTML,
                        fileName: attachedFileObj ? attachedFileObj.name : null,
                        fileData: attachedFileObj ? attachedFileObj.data : null,
                        fileType: attachedFileObj ? attachedFileObj.type : null
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    invalidateCache('avisos');
                    showToast(data.message || 'Aviso publicado!');
                    modalDiv.remove();
                    renderPage('avisos');
                } else {
                    showToast(data.message || 'Erro ao publicar aviso.');
                }
            });
        }

        async function renderProfessorActivitiesHistory() {
            centerTitle.innerText = "Histórico de Atividades Lançadas";

            const assigned = courses.find(c => c.id === user.assignedCourse);
            if (!assigned) {
                centerContent.innerHTML = `<p>${ICONS.warning} Selecione o curso que leciona em <strong>Meu Perfil</strong>.</p>`;
                return;
            }

            const launchedActivities = [];
            assigned.modules.forEach(mod => {
                mod.contents.forEach(cnt => {
                    if (cnt.isAssignment) launchedActivities.push({ ...cnt, moduleName: mod.name, moduleId: mod.id });
                });

                        const deadlineInfo = evaluateDeadlineClient(act);
                        const actForaPrazo = act.fora_do_prazo || deadlineInfo.fora_do_prazo;
                        const badgeColor = actForaPrazo === 'V' ? 'rgba(220, 38, 38, 0.7)' : 'rgba(16, 185, 129, 0.6)';
                        const badgeText = formatForaPrazoBadge(actForaPrazo);
                        const isProva = act.e_prova === 'V';

                        const infoPrazoExtra = isProva
                            ? (deadlineInfo.isPastEnd ? ' (Sem tolerância)' : '')
                            : ' (Tolerância: 2 dias)';

                        return `
                            <div style="background: rgba(255,255,255,0.15); padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.3); display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px;">
                                <div style="flex: 1; min-width: 220px;">
                                    <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom: 6px;">
                                        <span style="font-size: 0.8rem; background: rgba(245, 158, 11, 0.4); padding: 2px 8px; border-radius: 6px;">${ICONS.folder} Módulo: ${act.moduleName}</span>
                                        <span style="font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: ${badgeColor};">${badgeText}</span>
                                    </div>
                                    <strong style="color: #fef3c7; font-size:1.05rem; display:block;">${isProva ? `${ICONS.exam} [PROVA${act.evaluationCode ? ' - ' + act.evaluationCode : ''}]` : `${ICONS.clipboard} [ATIVIDADE${act.evaluationCode ? ' - ' + act.evaluationCode : ''}]`} ${act.subject}</strong>
                                    <div style="font-size:0.85rem; opacity:0.9; margin-top:2px;">${act.description || 'Sem descrição'}</div>
                                    <div style="font-size:0.78rem; opacity:0.8; margin-top:6px;">Período: ${act.startDate ? new Date(act.startDate).toLocaleString('pt-BR') : '-'} até ${act.endDate ? new Date(act.endDate).toLocaleString('pt-BR') : '-'}${infoPrazoExtra}</div>
                                    <div class="rendered-content" style="font-size:0.85rem; margin-top:8px; background: rgba(0,0,0,0.2); padding:8px; border-radius:6px; word-break:break-word;">${act.textHtml}</div>
                                </div>
                                <div style="display:flex; gap:8px; align-items:center;">
                                    <button class="glass-btn btn-edit-hist-act" data-mod-id="${act.moduleId}" data-act-id="${act.id}" style="width: auto; padding: 6px 12px; font-size: 0.8rem;">${ICONS.edit} Editar</button>
                                    <button class="glass-btn btn-del-hist-act" data-mod-id="${act.moduleId}" data-act-id="${act.id}" style="width: auto; padding: 6px 12px; font-size: 0.8rem; background: linear-gradient(135deg,#dc2626,#7f1d1d);">${ICONS.trash} Excluir</button>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;

            centerContent.querySelectorAll('.btn-edit-hist-act').forEach(btn => {
                btn.addEventListener('click', () => {
                    const modObj = assigned.modules.find(m => m.id === btn.getAttribute('data-mod-id'));
                    const actObj = modObj.contents.find(c => c.id === btn.getAttribute('data-act-id'));
                    renderModuleContentEditor(assigned, modObj, false, actObj);
                });
            });

            centerContent.querySelectorAll('.btn-del-hist-act').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const modId = btn.getAttribute('data-mod-id');
                    const actId = btn.getAttribute('data-act-id');
                    if (!confirm('Deseja realmente excluir esta atividade lançada?')) return;

                    const res = await fetch(`/api/courses/${assigned.id}/modules/${modId}/content/${actId}`, {
                        method: 'DELETE',
                        headers: { 'x-user-role': user.role }
                    });
                    const data = await res.json();
                    if (res.ok) {
                        invalidateCache('courses', 'submissions', 'boletim');
                        showToast(data.message || 'Atividade excluída.');
                        renderProfessorActivitiesHistory();
                    } else {
                        showToast(data.message || 'Erro ao excluir atividade.');
                    }
                });
            });
        }

        function renderStudentAssignmentModal(course, moduleObj, assignment, existingSub = null) {

            const isClosed = deadlineInfo.isClosed && !isAppealAccepted;
            const currentPrazoCode = existingSub ? (existingSub.fora_do_prazo || deadlineInfo.fora_do_prazo) : deadlineInfo.fora_do_prazo;

            const modalDiv = document.createElement('div');
            modalDiv.className = 'modal-overlay';
            modalDiv.innerHTML = `
                <div class="modal-card" style="max-width: 550px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap;">
                        <h3 style="margin:0;">${assignment.e_prova === 'V' ? `${ICONS.exam} Prova` : `${ICONS.clipboard} Atividade`}: ${assignment.subject}</h3>
                        <span style="font-size:0.75rem; font-weight:700; padding:3px 8px; border-radius:6px; background:${currentPrazoCode === 'V' ? 'rgba(220,38,38,0.75)' : 'rgba(16,185,129,0.65)'};">${formatForaPrazoBadge(currentPrazoCode)}</span>

                    <div class="rendered-content" style="font-size: 0.85rem; background: rgba(0,0,0,0.22); padding: 10px; border-radius: 8px; margin-bottom: 10px;">${assignment.textHtml || ''}</div>
                    ${deadlineInfo.inTolerance ? `<div style="background: rgba(245, 158, 11, 0.35); border: 1px solid #f59e0b; padding: 8px; border-radius: 8px; font-size: 0.8rem; margin-bottom: 10px;">${ICONS.warning} Atenção: O prazo oficial encerrou, mas esta atividade está no período de tolerância de 2 dias.</div>` : ''}
                    ${isAppealAccepted ? `<div style="background: rgba(16, 185, 129, 0.35); border: 1px solid #10b981; padding: 8px; border-radius: 8px; font-size: 0.8rem; margin-bottom: 10px;">${ICONS.sparkle} Apelação aceita! Prazo de 24h para envio até ${new Date(existingSub.appealDeadline).toLocaleString('pt-BR')}.</div>` : ''}
                    ${isClosed ? `<div style="background: rgba(220, 38, 38, 0.45); border: 1px solid #ef4444; padding: 8px; border-radius: 8px; font-size: 0.82rem; margin-bottom: 10px;"><svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg> Prazo encerrado${assignment.e_prova === 'V' ? ' (Sem tolerância)' : ''}! Esta avaliação está fechada para novas respostas e a nota automática é 0.</div>` : ''}
                    <div class="editor-toolbar" style="${isClosed ? 'display:none;' : ''}">
                        <button type="button" id="btnAstBold"><b>Negrito</b></button>
                        <button type="button" id="btnAstItalic"><i>Itálico</i></button>
                        <label for="inputAstImg">${ICONS.image} Inserir Imagem</label>
                        <input type="file" id="inputAstImg" accept="image/*" style="display: none;">
                    </div>
                    <div id="richAssignmentEditor" class="rich-text-editor" contenteditable="${!isClosed}" style="min-height: 150px;">${existingSub ? existingSub.submissionHtml : ''}</div>
                    <div style="display: flex; gap: 8px; margin-top: 12px;">
                        ${!isClosed ? `<button type="button" id="btnSubmitAssignment" class="glass-btn" style="flex: 1; padding: 10px; justify-content: center;">Enviar Resposta</button>` : ''}
                        <button type="button" id="btnCloseAstModal" class="glass-btn btn-logout" style="flex: 1; padding: 10px; justify-content: center;">Fechar</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modalDiv);

            const ed = modalDiv.querySelector('#richAssignmentEditor');
            if (!isClosed) {
                enableImageResizingInEditor(ed);
                insertImageIntoEditor(modalDiv.querySelector('#inputAstImg'), ed);
                modalDiv.querySelector('#btnAstBold').addEventListener('click', () => { ed.focus(); document.execCommand('bold'); });
                modalDiv.querySelector('#btnAstItalic').addEventListener('click', () => { ed.focus(); document.execCommand('italic'); });

                modalDiv.querySelector('#btnSubmitAssignment').addEventListener('click', async () => {
                    const res = await fetch('/api/submissions', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'x-user-role': user.role },
                        body: JSON.stringify({
                            courseId: course.id,
                            moduleId: moduleObj.id,
                            contentId: assignment.id,
                            studentEmail: user.email,
                            studentName: user.name,
                            submissionHtml: ed.innerHTML
                        })
                    });
                    const data = await res.json();
                    invalidateCache('submissions', 'boletim');

                <div style="background: rgba(0,0,0,0.25); padding: 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.3); display: flex; flex-direction: column; gap: 12px;">
                    <div>
                        <label style="font-size:0.82rem; font-weight:600; display:block; margin-bottom:4px;">Assunto (Obrigatório)*</label>
                        <input type="text" id="inputSubject" class="admin-input" value="${editItem ? editItem.subject : ''}" placeholder="Ex: Introdução ou Exercício Prático" required>
                    </div>
                    <div>
                        <label style="font-size:0.82rem; font-weight:600; display:block; margin-bottom:4px;">Breve Descrição (Opcional)</label>
                        <input type="text" id="inputDescription" class="admin-input" value="${editItem ? editItem.description : ''}" placeholder="Resumo...">

                    </div>
                    <div id="assignmentDatesWrapper" style="display: ${editItem && editItem.isAssignment ? 'flex' : 'none'}; gap: 10px; flex-wrap: wrap;">
                        <div style="flex: 1; min-width: 160px;">
                            <label style="font-size:0.8rem; font-weight:600; display:block; margin-bottom:4px;">Tipo de Avaliação</label>
                            <select id="selectEProva" class="admin-select">
                                <option value="F" ${!editItem || editItem.e_prova !== 'V' ? 'selected' : ''}>Atividade Avaliativa (2 dias tolerância)</option>
                                <option value="V" ${editItem && editItem.e_prova === 'V' ? 'selected' : ''}>Prova (Sem tolerância)</option>
                            </select>
                        </div>
                        <div style="flex: 1; min-width: 160px;">
                            <label style="font-size:0.8rem; font-weight:600; display:block; margin-bottom:4px;">Identificação (Boletim)*</label>
                            <select id="selectEvaluationCode" class="admin-select"></select>
                        </div>
                        <div style="flex: 1; min-width: 140px;">
                            <label style="font-size:0.8rem; font-weight:600; display:block; margin-bottom:4px;">Data Início</label>
                            <input type="datetime-local" id="inputStartDate" class="admin-input" value="${editItem ? editItem.startDate || '' : ''}">
                        </div>
                        <div style="flex: 1; min-width: 140px;">
                            <label style="font-size:0.8rem; font-weight:600; display:block; margin-bottom:4px;">Data Fim (Entrega)</label>
                            <input type="datetime-local" id="inputEndDate" class="admin-input" value="${editItem ? editItem.endDate || '' : ''}">
                        </div>
                    </div>

                    <div id="editorContainerWrapper">
                        <div id="simpleEditorBox" style="display: ${editItem && editItem.isAssignment ? 'block' : 'none'};">
                            <label style="font-size:0.82rem; font-weight:600; display:block; margin-bottom:4px;">Instruções da Atividade</label>
                            <div class="editor-toolbar">
                                <button type="button" id="btnAstSimpleBold"><b>Negrito</b></button>
                                <button type="button" id="btnAstSimpleItalic"><i>Itálico</i></button>
                                <label for="inputAstSimpleImg">${ICONS.image} Inserir Imagem</label>
                                <input type="file" id="inputAstSimpleImg" accept="image/*" style="display: none;">
                            </div>
                            <div id="richAssignmentEditor" class="rich-text-editor" contenteditable="true">${editItem && editItem.isAssignment ? editItem.textHtml : ''}</div>
                        </div>

                        <div id="fullEditorBox" style="display: ${!editItem || !editItem.isAssignment ? 'block' : 'none'};">
                            <label style="font-size:0.82rem; font-weight:600; display:block; margin-bottom:4px;">Editor Completo de Conteúdo de Aula (Com Imagens e Anexos)</label>
                            <div class="editor-toolbar">
                                <button type="button" id="btnFullBold"><b>Negrito</b></button>
                                <button type="button" id="btnFullItalic"><i>Itálico</i></button>
                                <label for="inputEditorImg">${ICONS.image} Inserir Imagem</label>
                                <input type="file" id="inputEditorImg" accept="image/*" style="display: none;">
                            </div>
                            <div id="richFullEditor" class="rich-text-editor" contenteditable="true">${editItem && !editItem.isAssignment ? editItem.textHtml : ''}</div>
                            <div style="margin-top: 8px;">
                                <label style="font-size:0.82rem; font-weight:600; display:block; margin-bottom:4px;">Anexar Arquivo (.docx, .pptx)</label>
                                <input type="file" id="inputFileAttachment" accept=".docx,.pptx" class="admin-input" style="padding: 6px;">

                        </div>
                    </div>

                    <button id="btnFinishContent" class="glass-btn" style="justify-content:center; padding:10px;">${editItem ? 'Salvar Alterações' : 'Finalizar e Publicar'}</button>
