            `;

            document.getElementById('backToModules').addEventListener('click', () => renderProfessorCourseView(course, isAdminView));

            const checkAssign = document.getElementById('checkIsAssignment');
            const datesWrapper = document.getElementById('assignmentDatesWrapper');
            const simpleEditorBox = document.getElementById('simpleEditorBox');
            const fullEditorBox = document.getElementById('fullEditorBox');
            const richAstEd = document.getElementById('richAssignmentEditor');
            const richFullEd = document.getElementById('richFullEditor');

            if (richAstEd) {
                enableImageResizingInEditor(richAstEd);
                insertImageIntoEditor(document.getElementById('inputAstSimpleImg'), richAstEd);
                document.getElementById('btnAstSimpleBold').addEventListener('click', () => { richAstEd.focus(); document.execCommand('bold'); });
                document.getElementById('btnAstSimpleItalic').addEventListener('click', () => { richAstEd.focus(); document.execCommand('italic'); });
            }
            if (richFullEd) {
                enableImageResizingInEditor(richFullEd);
                insertImageIntoEditor(document.getElementById('inputEditorImg'), richFullEd);
                document.getElementById('btnFullBold').addEventListener('click', () => { richFullEd.focus(); document.execCommand('bold'); });
                document.getElementById('btnFullItalic').addEventListener('click', () => { richFullEd.focus(); document.execCommand('italic'); });
            }

            const selectEProva = document.getElementById('selectEProva');
            const selectEvaluationCode = document.getElementById('selectEvaluationCode');

            function populateEvaluationCodes(selectedCode = null) {
                const isProva = selectEProva.value === 'V';
                const options = isProva
                    ? [
                        { value: 'Av1', label: 'Av1 - Avaliação 1 (Prova)' },
                        { value: 'Av2', label: 'Av2 - Avaliação 2 (Prova)' },
                        { value: 'Av3', label: 'Av3 - Avaliação 3 (Prova)' }
                      ]
                    : [
                        { value: 'At1', label: 'At1 - Atividade Avaliativa 1' },
                        { value: 'At2', label: 'At2 - Atividade Avaliativa 2' },
                        { value: 'At3', label: 'At3 - Atividade Avaliativa 3' }
                      ];

                selectEvaluationCode.innerHTML = options.map(opt =>
                    `<option value="${opt.value}" ${selectedCode === opt.value ? 'selected' : ''}>${opt.label}</option>`
                ).join('');
            }

            populateEvaluationCodes(editItem ? editItem.evaluationCode : null);
            selectEProva.addEventListener('change', () => populateEvaluationCodes());

            checkAssign.addEventListener('change', () => {
                const isAct = checkAssign.checked;
                datesWrapper.style.display = isAct ? 'flex' : 'none';
                simpleEditorBox.style.display = isAct ? 'block' : 'none';
                fullEditorBox.style.display = isAct ? 'none' : 'block';
            });

            let attachedFileObj = null;
            const fileInputAtt = document.getElementById('inputFileAttachment');
            if (fileInputAtt) {
                fileInputAtt.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        attachedFileObj = { name: file.name, type: file.type, data: event.target.result };
                    };
                    reader.readAsDataURL(file);
                });
            }

            document.getElementById('btnFinishContent').addEventListener('click', async () => {
                const subject = document.getElementById('inputSubject').value.trim();
                const description = document.getElementById('inputDescription').value.trim();
                const isAssignment = checkAssign.checked;
                const e_prova = isAssignment ? selectEProva.value : null;
                const evaluationCode = isAssignment ? selectEvaluationCode.value : null;
                const startDate = document.getElementById('inputStartDate').value;
                const endDate = document.getElementById('inputEndDate').value;
                const textHtml = isAssignment ? richAstEd.innerHTML : richFullEd.innerHTML;

                if (!subject) {
                    showToast('O assunto é obrigatório!');
                    return;
                }
                if (isAssignment && (!startDate || !endDate)) {
                    showToast('Informe a data de início e término da atividade.');
                    return;
                }

                const payload = {
                    subject,
                    description,
                    textHtml,
                    isAssignment,
                    e_prova,
                    evaluationCode,
                    startDate,
                    endDate,
                    authorName: user.name,
                    authorEmail: user.email,
                    fileName: attachedFileObj ? attachedFileObj.name : null,
                    fileData: attachedFileObj ? attachedFileObj.data : null,
                    fileType: attachedFileObj ? attachedFileObj.type : null
                };

                const url = editItem ? `/api/courses/${course.id}/modules/${moduleObj.id}/content/${editItem.id}` : `/api/courses/${course.id}/modules/${moduleObj.id}/content`;
                const method = editItem ? 'PUT' : 'POST';

                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json', 'x-user-role': user.role },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (res.ok) {
                    invalidateCache('courses', 'boletim');
                    const refreshedCourses = await fetchCourses();
                    const updatedCourse = refreshedCourses.find(c => c.id === course.id) || course;
                    showToast(data.message);
                    renderProfessorCourseView(updatedCourse, isAdminView);
                } else {
                    showToast(data.message || 'Erro ao salvar.');
                }
            });
        }

        function renderStudentCourseDetails(course) {
            centerTitle.innerText = `Curso: ${course.title}`;
            centerContent.innerHTML = `
                <button class="back-btn" id="backToStudentCourses">Voltar</button>
                <p>${course.description}</p>
                <div class="modules-container">
                    ${course.modules.map(mod => {
                        const theoreticalContents = mod.contents.filter(cnt => !cnt.isAssignment);
                        return `
                            <div class="module-box" style="cursor: default;">
                                <div class="module-title">${mod.name}</div>
                                <div style="margin-top:6px; display:flex; flex-direction:column; gap:6px;">
                                    ${theoreticalContents.length === 0 ? '<p style="font-size:0.82rem; opacity:0.75;">Nenhum conteúdo teórico disponível neste módulo.</p>' : ''}
                                    ${theoreticalContents.map(cnt => `
                                        <div style="background: rgba(255,255,255,0.1); padding: 8px; border-radius: 6px;">
                                            <strong>${ICONS.pin} Matéria: ${cnt.subject}</strong>
                                            ${cnt.description ? `<div style="font-size:0.8rem; opacity:0.85; margin-top:2px;">${cnt.description}</div>` : ''}
                                            <div class="rendered-content" style="font-size:0.82rem; margin-top:4px; word-break:break-word;">${cnt.textHtml}</div>
                                            ${cnt.file ? `<div style="margin-top:6px; font-size:0.8rem;"><a href="${cnt.file.data}" download="${cnt.file.name}" style="color:#fef3c7; text-decoration:underline;">Anexo: ${cnt.file.name}</a></div>` : ''}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
            document.getElementById('backToStudentCourses').addEventListener('click', () => renderPage('my_courses'));
        }

        function setupProfileEvents() {
            const avatarClickArea = document.getElementById('avatarClickArea');
            const avatarFileInput = document.getElementById('avatarFileInput');
            avatarClickArea.addEventListener('click', () => avatarFileInput.click());

            avatarFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => openAvatarCropperModal(event.target.result);
                reader.readAsDataURL(file);
                e.target.value = '';
            });

            if (user.role === 'Professor') {
                const btnSaveTeacher = document.getElementById('btnSaveTeacherCourse');
                if (btnSaveTeacher) {
                    btnSaveTeacher.addEventListener('click', async () => {
                        const selectedCourseId = document.getElementById('teacherCourseSelect').value;
                        const res = await fetch('/api/profile', {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email: user.email, assignedCourse: selectedCourseId })
                        });
                        const data = await res.json();
                        if (res.ok) {
                            user.assignedCourse = data.user.assignedCourse;
                            localStorage.setItem('masterclass_user', JSON.stringify(user));
                            showToast('Curso vinculado com sucesso!');
                        }
                    });
                }
            }

            const nameEditForm = document.getElementById('nameEditForm');
            const btnEditName = document.getElementById('btnEditName');
            const inputNewName = document.getElementById('inputNewName');
            const btnSaveName = document.getElementById('btnSaveName');

            btnEditName.addEventListener('click', () => {
                inputNewName.value = user.name;
                const isHidden = nameEditForm.style.display === 'none';
                nameEditForm.style.display = isHidden ? 'flex' : 'none';
                if (isHidden) focusAndScrollTo(inputNewName);
            });

            btnSaveName.addEventListener('click', async () => {
                const newName = inputNewName.value.trim();
                if (!newName) return;
                const res = await fetch('/api/profile', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: user.email, name: newName })
                });
                const data = await res.json();
                if (res.ok) {
                    user.name = data.user.name;
                    localStorage.setItem('masterclass_user', JSON.stringify(user));
                    document.getElementById('userName').innerText = user.name;
                    nameEditForm.style.display = 'none';
                    renderMenu();
                    showToast('Nome atualizado!');
                }
            });

            const btnOpenCreateAccModal = document.getElementById('btnOpenCreateAccModal');
            if (btnOpenCreateAccModal) {
                btnOpenCreateAccModal.addEventListener('click', openAdminCreateAccountModal);
            }
        }

        function openAvatarCropperModal(imageSrc) {
            const modalDiv = document.createElement('div');
            modalDiv.className = 'modal-overlay';
            modalDiv.innerHTML = `
                <div class="modal-card" style="text-align: center; max-width: 360px;">
                    <h3 style="margin-bottom: 10px;">Ajustar Foto de Perfil</h3>
                    <p style="font-size: 0.8rem; opacity: 0.8; margin-bottom: 12px;">Arraste a imagem para enquadrar no círculo</p>
                    
                    <div class="cropper-preview-container" id="cropperContainer">
                        <img src="${imageSrc}" class="cropper-image" id="cropperImg" alt="Crop">
                        <div class="cropper-overlay-mask"></div>
                    </div>

                    <div style="margin-bottom: 14px;">
                        <label style="font-size: 0.78rem; display:block; margin-bottom:4px;">Zoom</label>
                        <input type="range" id="zoomRange" min="0.5" max="3" step="0.05" value="1" style="width: 100%; cursor: pointer;">
                    </div>

                    <div style="display: flex; gap: 8px;">
                        <button type="button" id="btnConfirmCrop" class="glass-btn" style="flex: 1; padding: 10px; justify-content: center;">Concluir</button>
                        <button type="button" id="btnCloseCropModal" class="glass-btn btn-logout" style="flex: 1; padding: 10px; justify-content: center;">Cancelar</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modalDiv);

            const container = modalDiv.querySelector('#cropperContainer');
            const img = modalDiv.querySelector('#cropperImg');
            const zoomRange = modalDiv.querySelector('#zoomRange');

            let scale = 1;
            let posX = 0;
            let posY = 0;
            let isDragging = false;
            let startX = 0;
            let startY = 0;

            const updateTransform = () => {
                img.style.width = (img.naturalWidth * scale) + 'px';
                img.style.height = (img.naturalHeight * scale) + 'px';
                img.style.left = posX + 'px';
                img.style.top = posY + 'px';
            };

            img.onload = () => {
                const minDim = Math.min(img.naturalWidth, img.naturalHeight);
                scale = 280 / minDim;
                zoomRange.value = scale;
                posX = (280 - img.naturalWidth * scale) / 2;
                posY = (280 - img.naturalHeight * scale) / 2;
                updateTransform();
            };

            container.addEventListener('pointerdown', (e) => {
                isDragging = true;
                startX = e.clientX - posX;
                startY = e.clientY - posY;
                container.setPointerCapture(e.pointerId);
            });

            container.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                posX = e.clientX - startX;
                posY = e.clientY - startY;
                updateTransform();
            });

            container.addEventListener('pointerup', (e) => {
                isDragging = false;
                try { container.releasePointerCapture(e.pointerId); } catch {}
            });

            zoomRange.addEventListener('input', (e) => {
                const oldScale = scale;
                scale = parseFloat(e.target.value);
                const centerCoord = 140;
                posX = centerCoord - (centerCoord - posX) * (scale / oldScale);
                posY = centerCoord - (centerCoord - posY) * (scale / oldScale);
                updateTransform();
            });

            modalDiv.querySelector('#btnCloseCropModal').addEventListener('click', () => modalDiv.remove());

            modalDiv.querySelector('#btnConfirmCrop').addEventListener('click', async () => {
                const canvas = document.createElement('canvas');
                canvas.width = 280;
                canvas.height = 280;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, posX, posY, img.naturalWidth * scale, img.naturalHeight * scale);
                const croppedBase64 = canvas.toDataURL('image/jpeg', 0.9);

                const res = await fetch('/api/profile', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: user.email, avatar: croppedBase64 })
                });
                if (res.ok) {
                    user.avatar = croppedBase64;
                    localStorage.setItem('masterclass_user', JSON.stringify(user));
                    const profileAvatarElem = document.getElementById('userAvatar');
                    if (profileAvatarElem) profileAvatarElem.src = croppedBase64;
                    updateNavAvatar();
                    showToast('Foto de perfil atualizada com sucesso!');
                }
                modalDiv.remove();
            });
        }

        function updateNavAvatar() {
            const avatarElem = document.getElementById('navProfileAvatar');
            if (avatarElem) avatarElem.src = user.avatar || 'imagem4.jpeg';
        }
        updateNavAvatar();

        function openAdminCreateAccountModal() {
            const modalDiv = document.createElement('div');
            modalDiv.className = 'modal-overlay';
            modalDiv.innerHTML = `
                <div class="modal-card">
                    <h3 style="margin-bottom: 12px;">Criar Nova Conta</h3>
                    <form id="adminCreateForm" style="display: flex; flex-direction: column; gap: 10px;">
                        <div>
                            <label style="font-size:0.8rem; display:block; margin-bottom:4px;">Nome Completo</label>
                            <input type="text" id="admNewName" class="admin-input" placeholder="Nome" required>
                        </div>
                        <div>
                            <label style="font-size:0.8rem; display:block; margin-bottom:4px;">E-mail</label>
                            <input type="email" id="admNewEmail" class="admin-input" placeholder="email@exemplo.com" required>
                        </div>
                        <div>
                            <label style="font-size:0.8rem; display:block; margin-bottom:4px;">Tipo de Conta</label>
                            <select id="admNewRole" class="admin-select" style="width: 100%;">
                                <option value="Aluno">Aluno</option>
                                <option value="Professor">Professor</option>
                                <option value="Administrador">Administrador</option>
                            </select>
                        </div>
                        <div>
                            <label style="font-size:0.8rem; display:block; margin-bottom:4px;">Senha</label>
                            <input type="password" id="admNewPassword" class="admin-input" placeholder="Senha segura" required>
                        </div>
                        <div id="admCreateModalMsg" tabindex="-1" style="font-size: 0.8rem; display:none; padding:8px; border-radius:6px; text-align:center;"></div>
                        <div style="display: flex; gap: 8px; margin-top: 10px;">
                            <button type="submit" class="glass-btn" style="flex: 1; padding: 10px; justify-content: center;">Criar</button>
                            <button type="button" id="btnCloseModal" class="glass-btn btn-logout" style="flex: 1; padding: 10px; justify-content: center;">Cancelar</button>
                        </div>
                    </form>
                </div>
            `;
            document.body.appendChild(modalDiv);
            focusAndScrollTo(document.getElementById('admNewName'));

            modalDiv.querySelector('#btnCloseModal').addEventListener('click', () => modalDiv.remove());

            modalDiv.querySelector('#adminCreateForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('admNewName').value;
                const email = document.getElementById('admNewEmail').value;
                const role = document.getElementById('admNewRole').value;
                const password = document.getElementById('admNewPassword').value;
                const msgBox = document.getElementById('admCreateModalMsg');

                const res = await fetch('/api/admin/create-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-user-role': user.role },
                    body: JSON.stringify({ name, email, confirmEmail: email, role, password, confirmPassword: password })
                });
                const data = await res.json();
                msgBox.style.display = 'block';
                if (res.ok) {
                    msgBox.style.background = 'rgba(23, 185, 120,0.4)';
                    msgBox.style.color = '#d4ffec';
                    msgBox.innerText = data.message;
                    focusAndScrollTo(msgBox);
                    setTimeout(() => { modalDiv.remove(); showToast('Conta criada!'); }, 1200);
                } else {
                    msgBox.style.background = 'rgba(255, 77, 109, 0.4)';
                    msgBox.style.color = '#ffd1d6';
                    msgBox.innerText = data.issues ? data.issues[0].message : (data.message || 'Erro');
                    focusAndScrollTo(msgBox);
                }
            });
        }

        mainMenu.addEventListener('click', (e) => {
            const btn = e.target.closest('.glass-btn[data-page]');
            if (!btn) return;
            e.preventDefault();
            const pageKey = btn.getAttribute('data-page');
            mainMenu.querySelectorAll('.glass-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderPage(pageKey);
        });

        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('masterclass_user');
            window.location.href = 'index.html';
        });

        renderPage('avisos');
    </script>
